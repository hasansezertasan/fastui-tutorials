# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^(\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|_build|buck-out|build|dist|alembic)/
default_language_version:
  python: python3.11
default_stages: [pre-commit, pre-push]
repos:
  # https://github.com/pre-commit/pre-commit-hooks#pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Check added large files
      - id: check-toml
        name: Check TOML
      - id: check-yaml
        name: Check YAML
        args:
          - --unsafe
      - id: check-json
        name: Check JSON
      - id: end-of-file-fixer
        name: End of file fixer
      - id: trailing-whitespace
        name: Trailing whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: Ruff Linter
        types_or: [python, pyi, jupyter]
        args: [--config=pyproject.toml]
      - id: ruff-format
        name: Ruff Formatter
        types_or: [python, pyi, jupyter]
        args: [--config=pyproject.toml]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.1
    hooks:
      - id: check-github-actions
        name: Validate GitHub Actions
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: ["."]
  - repo: local
    hooks:
      - id: taplo-lint
        name: Taplo Lint
        entry: taplo lint
        language: python
        additional_dependencies: ["taplo>=0.9.3"]
        types: [toml]
      - id: taplo-format
        name: Taplo Format
        entry: taplo format
        language: python
        additional_dependencies: ["taplo>=0.9.3"]
        types: [toml]
      - id: validate-pyproject
        name: Validate Pyproject
        entry: validate-pyproject
        language: python
        additional_dependencies: ["validate-pyproject>=0.25", "tomli"]
        files: pyproject\.toml$
