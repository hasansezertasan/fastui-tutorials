[project]
name = "with-robyn"
version = "0.1.0"
description = "FastUI example with Robyn"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui[fastapi]", "robyn"]

[project.scripts]
with-robyn = "with_robyn:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
