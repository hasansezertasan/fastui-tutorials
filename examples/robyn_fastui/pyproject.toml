[project]
name = "robyn-fastui"
version = "0.1.0"
description = "FastUI example with Robyn"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui", "robyn"]

[project.scripts]
robyn-fastui = "robyn_fastui:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
