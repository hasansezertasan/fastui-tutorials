[project]
name = "with-tornado"
version = "0.1.0"
description = "FastUI example with Tornado"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui", "tornado"]

[project.scripts]
with-tornado = "with_tornado:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
