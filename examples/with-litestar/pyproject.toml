[project]
name = "with-litestar"
version = "0.1.0"
description = "FastUI example with Litestar"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui[fastapi]", "litestar", "uvicorn"]

[project.scripts]
with-litestar = "with_litestar:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
