[project]
name = "with-emmett"
version = "0.1.0"
description = "FastUI example with Emmett"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui[fastapi]", "emmett", "granian"]

[project.scripts]
with-emmett = "with_emmett:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
