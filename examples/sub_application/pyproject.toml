[project]
name = "sub-application"
version = "0.1.0"
description = "FastUI example: sub application"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastapi", "fastui", "uvicorn"]

[project.scripts]
sub-application = "sub_application:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
