[project]
name = "table-server-load"
version = "0.1.0"
description = "FastUI example: table with ServerLoad"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastapi", "fastui", "pydantic", "uvicorn"]

[project.scripts]
table-server-load = "table_server_load:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
