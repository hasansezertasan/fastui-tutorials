[project]
name = "simple-form"
version = "0.1.0"
description = "FastUI example: simple form"
readme = "README.md"
authors = [
    { name = "hasansezertasan", email = "hasansezertasan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = ["fastapi", "fastui", "pydantic", "uvicorn"]

[project.scripts]
simple-form = "simple_form:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
