[project]
name = "with-pyramid"
version = "0.1.0"
description = "FastUI example with Pyramid"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastui[fastapi]", "pyramid"]

[project.scripts]
with-pyramid = "with_pyramid:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
