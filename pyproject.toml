[project]
name = "fastui-tutorials"
description = "I'm exploring the capabilities of FastUI."
readme = "README.md"
version = "0.1.0"
license = { text = "MIT" }
authors = [{ name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" },
]
requires-python = "<4.0,>=3.10"
dependencies = [
  "fastui<1.0.0,>=0.6.0",
  "fastapi[all]<1.0.0,>=0.110.0",
  "flask<4.0.0,>=3.0.3",
  "litestar<3.0.0,>=2.8.3",
  "robyn<1.0.0,>=0.54.4",
]

[dependency-groups]
dev = [
  "mypy>=1.0.0",
  "ruff==0.16.6",
  "codespell<3.0.0,>=2.3.0",
  "pre-commit<4.6.3,>=4.6.2",
  "validate-pyproject>=0.25",
  "vulture>=2.16",
  "taplo>=0.9.3",
]
test = ["pytest<9.1.2,>=9.1.1"]


[tool.ruff]
show-fixes = true
extend-include = ["*.ipynb"]
fix = true


[tool.ruff.lint]
# Run `ruff linter` command to see all available linters and their descriptions
select = ["ALL"]
fixable = ["ALL"]
ignore = [
  "line-too-long", # line too long, handled by ruff format
]
preview = true

[tool.ruff.lint.per-file-ignores]
"components/navbar/src/navbar/__init__.py" = [
  "missing-copyright-notice",
  "undocumented-public-package",
]
"examples/**/*.py" = [
  "builtin-argument-shadowing",
  "unused-function-argument",
  "missing-copyright-notice",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "docstring-missing-returns",
  "fast-api-unused-path-parameter",
  "implicit-namespace-package",
  "unused-async",
  "non-empty-init-module",
  "flask-debug-true",
  "suspicious-non-cryptographic-random-usage",
  "print",
]
[tool.ruff.lint.flake8-copyright]
author = "Hasan Sezer Taşan <hasansezertasan@gmail.com>"


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.codespell]
skip = 'uv.lock'
count = true

[tool.vulture]
exclude = [".venv"]
ignore_names = ["path", "request"]
min_confidence = 100

[tool.uv.workspace]
members = [
  "components/navbar",
  "examples/basic_component_gallery",
  "examples/dynamic_page_titles",
  "examples/flask_fastui",
  "examples/hello_world",
  "examples/litestar_fastui",
  "examples/navigation",
  "examples/personal_portfolio",
  "examples/random_number_generator",
  "examples/robyn_fastui",
  "examples/simple_form",
  "examples/simple_layout",
  "examples/starlette_fastui",
  "examples/sub_application",
  "examples/table_server_load",
  "examples/with-blacksheep",
  "examples/with-bottle",
  "examples/with-django",
  "examples/with-emmet",
  "examples/with-falcon",
  "examples/with-fastapi",
  "examples/with-fastapi-sub-application",
  "examples/with-flask",
  "examples/with-hug",
  "examples/with-litestar",
  "examples/with-masonite",
  "examples/with-pyramid",
  "examples/with-quart",
  "examples/with-robyn",
  "examples/with-sanic",
  "examples/with-starlette",
  "examples/with-tornado",
]
